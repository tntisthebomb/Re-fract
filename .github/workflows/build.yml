name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install banner converter
        run: |
          python -m pip install gltflib==1.0.13 Pillow==11.3.0
          git clone https://github.com/skyfloogle/pycgfx.git .tools/pycgfx
          git -C .tools/pycgfx checkout 1f78850086f3a77c41e07162e842f97a5bf3c18a
          bash tools/install_cia_tools.sh
      - name: Generate animated icon cube
        run: |
          python tools/build_banner.py --converter .tools/pycgfx
          .tools/bin/bannertool makebanner -ci build/banner/cube.cgfx -a build/banner/silence.wav -o build/banner/cube.bnr
          test -s build/banner/cube.bnr
      - uses: actions/upload-artifact@v4
        with:
          name: Re-fract-banner
          path: build/banner/
          if-no-files-found: error
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable core tests
        run: |
          cmake -S . -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build -j2
          ctest --test-dir host-build --output-on-failure
      - name: Address and undefined behavior sanitizers
        run: |
          g++ -pthread -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror -Iinclude source/expression.cpp source/formula.cpp source/renderer.cpp source/storage.cpp source/ui.cpp tests/core.cpp -o host-build/sanitized
          ./host-build/sanitized
  new3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS libraries
        run: dkp-pacman -S --needed --noconfirm 3ds-dev
      - name: Build homebrew
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: Re-fract-program
          path: |
            Re-fract.3dsx
            Re-fract.smdh
            Re-fract.elf
          if-no-files-found: error
  package:
    needs: [banner, new3ds, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Re-fract-banner
          path: build/banner/
      - uses: actions/download-artifact@v4
        with:
          name: Re-fract-program
          path: ./
      - name: Package CIA on native Linux runtime
        run: |
          bash tools/install_cia_tools.sh
          bash tools/package_cia.sh .tools/bin/makerom
      - uses: actions/upload-artifact@v4
        with:
          name: Re-fract-3dsx-and-cia
          path: |
            Re-fract.3dsx
            Re-fract.smdh
            Re-fract.cia
          if-no-files-found: error
